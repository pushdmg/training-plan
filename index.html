<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Jon Mcgee upstairs gym coach. One exercise at a time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BotFit">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BotFit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="rest-overlay" hidden></div>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="pwa-detect.js"></script>
  <script src="app.js"></script>
  <script>
    setTimeout(function () {
      var a = document.getElementById("app");
      if (a && !a.innerHTML.trim()) {
        a.innerHTML = "<p style=\"padding:8px 0\">BotFit failed to load. Pull down to refresh, or tell Devster.</p>";
      }
    }, 1200);
  </script>
</body>
</html>
